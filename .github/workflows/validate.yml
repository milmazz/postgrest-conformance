name: validate
on: [push, pull_request]
# Every job only reads the repo — keep the token read-only rather than
# inheriting the repo default.
permissions:
  contents: read
jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Python is only here for internal/cases's pyyaml cross-check, which
      # guards the corpus against YAML 1.1 vs 1.2 parser divergence (see the
      # internal/validate package comment). Without pyyaml that test skips;
      # this job is the one environment guaranteed to run it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/oracle/go.mod
          # Explicit because the default cache lookup expects go.sum at the
          # repo root and would warn (and never cache) on every run.
          cache-dependency-path: tools/oracle/go.sum
      # Nothing else in CI reads the prose files, so an unresolved merge
      # conflict in COVERAGE.md, INDEX.md or HARNESS.md sails through every
      # other gate green — `oracle validate` checks the corpus and the area
      # tables, not the narrative around them. That is not hypothetical: it
      # happened while stacking the re-sync PRs, and the markers were only
      # caught by eye, one PR later.
      - name: No unresolved conflict markers
        run: |
          if grep -rnE '^(<{7} |={7}$|>{7} )' \
               --include='*.md' --include='*.yaml' --include='*.yml' \
               --include='*.go' --include='*.json' --include='*.sql' .; then
            echo "::error::unresolved merge conflict markers (listed above)"
            exit 1
          fi
          echo "no conflict markers"
      - run: go run ./cmd/oracle validate
        working-directory: tools/oracle
      - run: go test ./internal/validate/ ./internal/cases/
        working-directory: tools/oracle

  fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bier supports PG 15/16/17 (its CI matrix), so the fixture chain
        # must load cleanly on all three — not just the PG17 server that
        # `fixtures/06_area_schemas.sql` (raw pg_dump output) happens to be
        # generated against. `freshness` below stays pinned to 17-3.5 since
        # that job diffs the generator's output byte-for-byte against a
        # server matching the generation environment; this job only loads
        # SQL, so the exact PostGIS point release per major doesn't matter
        # as much — 15-3.5/16-3.5/17-3.5 are each the closest existing tag
        # (verified against the Docker Hub registry API).
        postgis_tag: ["15-3.5", "16-3.5", "17-3.5"]
    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgis_tag }}
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGTZ: UTC }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Load chain
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -q -f fixtures/01_roles.sql
          psql -d postgres -q -c "CREATE DATABASE conf TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
          for f in fixtures/0[2-7]_*.sql; do psql -d conf -v ON_ERROR_STOP=1 -q -f "$f"; done

  freshness:
    runs-on: ubuntu-latest
    services:
      # Same PostgreSQL 17 / PostGIS 3.5 pin as `fixtures` (see comment
      # there). This job is the one that actually matters for the pin:
      # `06_area_schemas.sql` is raw `pg_dump` output, which is stable only
      # per pg_dump *major* version (DDL formatting, comment ordering, etc.
      # can shift between majors even for byte-identical schemas). It was
      # generated locally against server 17 with pg_dump 18.4, so this job
      # must dump against a PG17 server with a v18 pg_dump to diff clean —
      # hence installing postgresql-client-18 below instead of using
      # ubuntu-latest's default client. (The generator also strips the
      # `\restrict`/`\unrestrict` lines pg_dump 18 adds and the "-- Dumped
      # ..." version-stamp comments, so those particular lines are already
      # deterministic across hosts; the remaining DDL body is not
      # guaranteed to be, which is what this pin protects.)
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with: { elixir-version: "1.18", otp-version: "27" }
      - name: Install postgresql-client-18 (PGDG apt repo)
        # ubuntu-latest doesn't ship a v18 client by default, so pull it
        # from the PGDG apt repo. This also puts /usr/lib/postgresql/18/bin
        # first on PATH so `pg_dump`/`psql` resolve to v18 (the pg_wrapper
        # default otherwise picks the newest installed version, which would
        # already be 18 here, but pinning PATH explicitly makes the
        # resolution non-ambiguous for whichever `psql`/`pg_dump` the
        # generator's `System.cmd`/`System.find_executable` calls resolve).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: elixir tools/regen_area_schemas.exs
      - run: git diff --exit-code fixtures/06_area_schemas.sql
