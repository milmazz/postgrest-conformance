id: 1019
feature: url_grammar/method/options
request:
  method: OPTIONS
  path: /items
  headers: {}
schema: test
expect:
  status: 200
  headers:
    Allow: OPTIONS,GET,HEAD,POST,PUT,PATCH,DELETE
    Content-Length: "0"
notes: "OPTIONS on a writeable relation resolves to ActRelationInfo and returns the Allow header of supported methods. Mirrors OptionsSpec 'includes read/write methods for writeable table' (v16.4 it at L14, request at L15, Allow assertion at L17, Content-Length 0 at L18)."
