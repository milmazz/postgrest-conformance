id: 1498
feature: auth/role-claim-key/nested-object
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload:
      postgrest: { "a_role": "postgrest_test_author" }
      other: claims
schema: auth
config:
  jwt-role-claim-key: "$.postgrest.a_role"
expect:
  status: 200
notes: >-
  v16.0 replaced the JSPath DSL of `jwt-role-claim-key` with RFC 9535 JSON Path
  (CHANGELOG.md#L126), so the v14.12 key `.postgrest.a_role` becomes
  `$.postgrest.a_role`. A nested member path selects the role to switch to.
  Upstream asserts the status only. v16.2 (PostgREST#5171) accepts the
  leading-dot form again as deprecated syntax; its twin, with the same payload
  and the v14.12 spelling, is 11819.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L123
