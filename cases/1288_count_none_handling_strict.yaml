id: 1288
feature: pagination/count/none_handling_strict
request:
  method: GET
  path: /items?id=eq.1
  headers:
    Accept: application/json
    Prefer: "count=none, handling=strict"
schema: pagination
expect:
  status: 400
  body_exact:
    code: "PGRST122"
    message: "Invalid preferences given with handling=strict"
    details: "Invalid preferences: count=none"
    hint: null
notes: >
  'count=none' is not a PreferCount value: fromHeaders parses the count
  preference with `parsePrefs [ExactCount, PlannedCount, EstimatedCount]`
  (Preferences.hs:134), so the token matches nothing. It is also absent from
  `acceptedPrefs` (Preferences.hs:145-151) and carries neither the `timezone=`
  nor the `max-affected=` prefix, so `isUnacceptable` (Preferences.hs:162)
  puts it in invalidPrefs (Preferences.hs:140). Under 'handling=strict' the
  read plan rejects the request: `if not (null invalidPrefs) && preferHandling
  == Just Strict then Left $ ApiRequestErr $ InvalidPreferences invalidPrefs`
  (Plan.hs:220) -> 400 PGRST122 (Error.hs:108, :168) with message
  "Invalid preferences given with handling=strict" (Error.hs:194) and details
  "Invalid preferences: " <> the offending tokens (Error.hs:213). Only
  'count=none' is listed; 'handling=strict' is itself an accepted preference.
  Upstream asserts this shape with a different token ("anything",
  HandlingSpec.hs:15, case 1551); pinning it for this area's own token is
  derived from source (ground-truth priority 2). Without handling=strict the
  same header is simply ignored (cases 1267, 1268).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/ApiRequest/Preferences.hs#L134
