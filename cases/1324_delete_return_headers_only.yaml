id: 1324
feature: representations/delete/return-headers-only
request:
  method: DELETE
  path: /items?id=eq.6
  headers:
    Prefer: "return=headers-only"
schema: representations
expect:
  status: 204
  headers:
    Content-Range: "*/*"
    Preference-Applied: "return=headers-only"
  headers_absent: [Content-Type, Content-Length, Location]
  body_exact: ""
notes: >-
  DELETE has no HeadersOnly arm either: the MutationDelete dispatch matches
  `Just Full` and `Just None`, and HeadersOnly falls into the `_` catch-all,
  producing the same 204/empty-body/no-Content-Type response as return=minimal
  while keeping Content-Range (Response.hs#L177, header list at
  Response.hs#L169-L171). With no count preference the delete range base 1 0
  renders as "*/*" (Response.hs#L169). Location is absent because the location
  expression is only built for INSERTs (Statements.hs#L63-L75). There is no
  upstream it-block for DELETE + return=headers-only — grepping v16.0's
  test/spec for "headers-only" finds only Insert/Update blocks — so this case is
  DERIVED FROM SOURCE: the status/body/headers come from the cited catch-all
  arm, and the Preference-Applied echo from responsePreferences passing
  preferRepresentation through for any MutateReadPlan{} (Response.hs#L288-L290)
  plus prefAppliedHeader (Preferences.hs#L186, token at Preferences.hs#L228).
  The sibling return=minimal DELETE (case 1322, DeleteSpec.hs#L55) pins the
  identical observable shape for the `Just None` arm.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response.hs#L177
