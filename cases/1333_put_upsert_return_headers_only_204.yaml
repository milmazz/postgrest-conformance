id: 1333
feature: representations/put/single-upsert-return-headers-only
request:
  method: PUT
  path: /items?id=eq.7
  headers:
    Prefer: "return=headers-only"
    Content-Type: application/json
  body: [{ "id": 7 }]
schema: representations
expect:
  status: 204
  headers:
    Preference-Applied: "return=headers-only"
  headers_absent: [Content-Type, Content-Length, Content-Range, Location]
  body_exact: ""
notes: >-
  PUT (single upsert) with return=headers-only takes the `_` catch-all arm of
  the MutationSingleUpsert dispatch: 204, empty body, and a header list that is
  prefHeader ALONE (Response.hs#L163). That makes PUT the only mutation whose
  empty-body response carries no Content-Range at all — the Full arm is the only
  one that adds Content-Length/Content-Type (Response.hs#L159-L161). The 204
  also overrides the insert-vs-replace status rule (Response.hs#L156-L158),
  which applies only to the Full arm; id=7 exists in the seeded items 1..15, so
  this request is a replace, but the status would be 204 either way. Location is
  absent because the location expression is only built for INSERT mutations
  (Statements.hs#L63-L75) and a PUT plan is not one. DERIVED FROM SOURCE: v16.0
  has no upstream it-block for PUT + return=headers-only. The
  Preference-Applied echo follows responsePreferences passing
  preferRepresentation through for any MutateReadPlan{} (Response.hs#L288-L290)
  and prefAppliedHeader (Preferences.hs#L186, token at Preferences.hs#L228) —
  the same mechanism upstream asserts for PUT + return=minimal at
  UpsertSpec.hs#L661-L673 (case 1332).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response.hs#L163
