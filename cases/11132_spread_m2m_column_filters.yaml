id: 11132
feature: select/spread/many-to-many-column-filters
request:
  method: GET
  path: /supervisors?select=supervisor:name,...processes(*)&processes.name=not.like.*1&order=name&processes.order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"supervisor":"Jane","id":[],"name":[],"factory_id":[],"category_id":[]}
    - {"supervisor":"John","id":[2, 4],"name":["Process A2", "Process B2"],"factory_id":[1, 2],"category_id":[2, 1]}
    - {"supervisor":"Mary","id":[4],"name":["Process B2"],"factory_id":[2],"category_id":[1]}
    - {"supervisor":"Peter","id":[6],"name":["Process C2"],"factory_id":[3],"category_id":[2]}
    - {"supervisor":"Sarah","id":[],"name":[],"factory_id":[],"category_id":[]}
notes: >
  Filters on an m2m spread embed (through the process_supervisor junction)
  narrow the arrays without dropping parents (SpreadQueriesSpec.hs:518).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L518
