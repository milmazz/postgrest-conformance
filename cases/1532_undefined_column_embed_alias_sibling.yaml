id: 1532
feature: errors/sqlstate/undefined_column_embed_alias_sibling
request:
  method: GET
  path: /processes?select=id,supervisors(id),factories(banana)
  headers: { Accept: application/json }
schema: test
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: "42703"
    details: null
    hint: null
    message: "column factories_1.banana does not exist"
notes: >
  1531 with an unrelated embed (`supervisors(id)`) placed BEFORE the failing
  one: the message is unchanged, `factories_1`. This is the case the band
  exists for. The alias suffix is the node's `depth` (cited line:
  `qiName (relForeignTable r) <> "_" <> show depth`), a property of the
  node's position in the tree, not a sequence number drawn from a counter
  shared across siblings — so what a client sees in an error does not
  depend on which other embeds the request happens to contain. Two sibling
  embeds of the SAME foreign table at the same depth share that alias,
  which is harmless because each lives in its own lateral subquery. An
  implementer that numbers embeds off a global counter passes 1531 (its
  only embed is the first) and fails here with `factories_2`-style names
  (milmazz/bier#162).

  EXTRAPOLATION beyond upstream's own coverage, as for 1531: no upstream
  it-block requests an unknown column inside an embed. The body was read
  off a live run of the pinned v16.4 binary against this suite's fixtures
  (issue #32).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Plan.hs#L583
