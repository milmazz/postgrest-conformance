id: 1662
feature: openapi/table/response-status
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  body_jsonpath:
    - { path: "$.paths['/child_entities'].get.responses['200'].description", equals: "OK" }
    - { path: "$.paths['/child_entities'].get.responses['206'].description", equals: "Partial Content" }
    - { path: "$.paths['/child_entities'].post.responses['201'].description", equals: "Created" }
    - { path: "$.paths['/child_entities'].patch.responses['204'].description", equals: "No Content" }
    - { path: "$.paths['/child_entities'].delete.responses['204'].description", equals: "No Content" }
notes: >
  Per-method response status descriptions for a writable table, all five
  produced by makePathItem.
  RE-CITED this pass: the five assertions do NOT share one source, and the
  previous single anchor (OpenApiSpec.hs#L127) over-claimed.
  * POST 201 "Created", PATCH 204 "No Content", DELETE 204 "No Content" ARE
    asserted upstream, inside the "includes definitions to tables"/child-entities
    block: `postResponse shouldBe Just "Created"`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/OpenApi/OpenApiSpec.hs#L127),
    `patchResponse shouldBe Just "No Content"` (#L129) and
    `deleteResponse shouldBe Just "No Content"` (#L131), reading the lenses
    bound at #L82-L84.
  * GET 200 "OK" and GET 206 "Partial Content" are asserted by NO upstream
    Feature test. Grepping test/spec/Feature/OpenApi/*.hs for "Partial Content"
    or `key "206"` returns nothing, and the only `key "200"` in the file
    (OpenApiSpec.hs#L142) reads that response's `schema`, never its
    `description` — that is case 1663's assertion, not this one. Both values
    are therefore cited to the generator that emits them:
    `& at 206 ?~ "Partial Content"`
    (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response/OpenAPI.hs#L403)
    and `& at 200 ?~ Inline ((mempty :: Response) & description .~ "OK" ...)`
    (#L404-L407). PostgREST source is ground truth in its own right, so the
    values stay cased; only the citation changes.
  The same function emits the writable-table arms this case reads:
  `at 201 ?~ "Created"` (OpenAPI.hs#L418), `at 204 ?~ "No Content"` for PATCH
  (#L422) and for DELETE (#L426), and the post/patch/delete path items exist
  only because `tableInsertable || tableUpdatable || tableDeletable` holds for
  test.child_entities (OpenAPI.hs#L388).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response/OpenAPI.hs#L403
