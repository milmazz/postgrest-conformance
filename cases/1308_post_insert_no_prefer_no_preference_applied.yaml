id: 1308
feature: representations/post/no-prefer-header-no-preference-applied
request:
  method: POST
  path: /complex_items
  headers:
    Content-Type: application/json
  body: { "id": 101, "name": "Ciento Uno" }
schema: representations
expect:
  status: 201
  headers:
    Content-Range: "*/*"
    Content-Length: "0"
  headers_absent: [Content-Type, Location, Preference-Applied]
  body_exact: ""
notes: >-
  A mutation sent with NO Prefer header at all carries no Preference-Applied
  response header. This is the distinguishing half of the
  default-vs-return=minimal pair: both produce an empty body and the same
  status, but only the explicit `return=minimal` echoes
  `Preference-Applied: return=minimal` (case 1302). prefAppliedHeader collects
  the applied preferences into `prefsVals` and returns Nothing when that list
  is empty, so no header is emitted (Preferences.hs#L176-L178 with the
  collection at #L182-L192). Location is likewise absent: the SQL builder only
  computes a location expression when the requested representation is exactly
  HeadersOnly (Statements.hs#L63-L75), which the upstream no-representation
  insert into a compound-PK relation confirms with matchHeaderAbsent hLocation
  (InsertSpec.hs#L894-L903). Content-Length: 0 is present because the
  MutationCreate clause prepends contentLengthHeader unconditionally
  (Response.hs#L126), and Content-Range is the insert range base 1 0 with no
  count preference => "*/*" (Response.hs#L109-L110).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/ApiRequest/Preferences.hs#L176
