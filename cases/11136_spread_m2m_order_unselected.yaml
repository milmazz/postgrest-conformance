id: 11136
feature: select/spread/many-to-many-order-unselected
request:
  method: GET
  path: /supervisors?select=supervisor:name,...processes(name)&processes.order=category_id.asc,name.desc&order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"supervisor":"Jane","name":[]}
    - {"supervisor":"John","name":["Process B2", "Process A2"]}
    - {"supervisor":"Mary","name":["Process B2", "Process A1"]}
    - {"supervisor":"Peter","name":["Process B1", "Process C2", "Process C1"]}
    - {"supervisor":"Sarah","name":["Process B1"]}
notes: >
  The m2m spread's ordering columns need not be selected
  (SpreadQueriesSpec.hs:577).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L577
