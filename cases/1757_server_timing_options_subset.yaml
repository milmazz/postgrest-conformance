id: 1757
feature: observability/server-timing/options-table
request:
  method: OPTIONS
  path: /organizations
  headers: {}
schema: observability
config:
  server-timing-enabled: true
expect:
  status: 200
  headers_present: [Server-Timing]
  headers_match:
    Server-Timing: "jwt;dur=[0-9]+\\.[0-9]+.*parse;dur=[0-9]+\\.[0-9]+.*response;dur=[0-9]+\\.[0-9]+"
  body_exact: null
notes: >
  OPTIONS on a table carries a Server-Timing header. Upstream asserts ONLY the
  presence of jwt, parse and response
  (test/spec/Feature/Query/ServerTimingSpec.hs#L94-L102, via
  matchServerTimingHasTiming, a presence-only regex — SpecHelper.hs#L81-L89,
  which never asserts absence), so this case asserts exactly that and nothing
  more.
  DO NOT assert that plan and transaction are absent: they are PRESENT. The
  anchored line wraps the transaction stage in `withTiming`, and `withTiming`
  (App.hs#L295-L302) branches only on configServerTimingEnabled — never on the
  action — so the plan stage (App.hs#L229) and the transaction stage are timed
  on OPTIONS too. `Plan.actionPlan` returns `NoDb (RelInfoPlan …)`
  (Plan.hs#L194) and `MainTx.mainTx` returns `NoDbTx` (MainTx.hs#L94): no plan
  is built and no DB transaction is opened, but both stages still produce a
  `Just t`, so a real v16.0 response reads
  `jwt;dur=…, parse;dur=…, plan;dur=…, transaction;dur=…, response;dur=…`.
  An earlier pass of this case carried
  `headers_absent_in_value: {Server-Timing: [plan, transaction]}`; that pinned
  behavior PostgREST does not have and has been removed.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/App.hs#L247
