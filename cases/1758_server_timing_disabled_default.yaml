id: 1758
feature: observability/server-timing/disabled-default
request:
  method: GET
  path: /organizations?id=eq.6
  headers: { Accept: application/json }
schema: observability
config:
  server-timing-enabled: false
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  headers_absent: [Server-Timing]
  body_exact: [{ "id": 6, "name": "Oscorp", "referee": 3, "auditor": 4, "manager_id": 6 }]
notes: >
  server-timing-enabled defaults to false; when disabled the Server-Timing
  header is omitted entirely - App.hs:275/256 only appends the header when
  configServerTimingEnabled is true, and withTiming (App.hs:295-302) then
  returns Nothing for every stage. Default `fromMaybe False` at Config.hs:353.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/App.hs#L278
