id: 11102
feature: select/spread/one-to-many-empty-array
request:
  method: GET
  path: /factories?select=factory:name,...processes(processes:name)&processes=is.null
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"factory":"Factory D","processes":[]}
notes: >
  A spread to-many with no matching children yields an empty array (not
  null); filtering the embed is.null keeps only such parents
  (SpreadQueriesSpec.hs:135).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L135
