id: 11134
feature: select/spread/many-to-many-order-spread-columns
request:
  method: GET
  path: /supervisors?select=supervisor:name,...processes(*)&processes.order=category_id.asc,name.desc&order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"supervisor":"Jane","id":[],"name":[],"factory_id":[],"category_id":[]}
    - {"supervisor":"John","id":[4, 2],"name":["Process B2", "Process A2"],"factory_id":[2, 1],"category_id":[1, 2]}
    - {"supervisor":"Mary","id":[4, 1],"name":["Process B2", "Process A1"],"factory_id":[2, 1],"category_id":[1, 1]}
    - {"supervisor":"Peter","id":[3, 6, 5],"name":["Process B1", "Process C2", "Process C1"],"factory_id":[2, 3, 3],"category_id":[1, 2, 2]}
    - {"supervisor":"Sarah","id":[3],"name":["Process B1"],"factory_id":[2],"category_id":[1]}
notes: >
  processes.order orders every resulting array in lockstep on an m2m
  spread (SpreadQueriesSpec.hs:551, first get).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L551
