id: 11107
feature: select/spread/one-to-many-nested-one-to-many
request:
  method: GET
  path: /factories?select=factory:name,...processes(process:name,...process_supervisor(supervisor_ids:supervisor_id))&order=name&processes.order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"factory":"Factory A","process":["Process A1", "Process A2"],"supervisor_ids":[[1], [2]]}
    - {"factory":"Factory B","process":["Process B1", "Process B2"],"supervisor_ids":[[3, 4], [1, 2]]}
    - {"factory":"Factory C","process":["Process C1", "Process C2", "Process XX", "Process YY"],"supervisor_ids":[[3], [3], [], []]}
    - {"factory":"Factory D","process":[],"supervisor_ids":[]}
notes: >
  A one-to-many spread nested inside a spread to-many yields an array of
  arrays — one inner array per intermediate child row
  (SpreadQueriesSpec.hs:184).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L184
