id: 11804
feature: auth/role-claim-key/filter-not-equals
request:
  method: GET
  path: /authors_only
  headers: { Accept: application/json }
  jwt:
    sign_with: hs256_test_secret
    payload:
      realm_access: { "roles": ["other", "postgrest_test_author"] }
schema: auth
config:
  jwt-role-claim-key: '$.realm_access.roles[?(@ != "other")]'
expect:
  status: 200
notes: >-
  Negated RFC 9535 filter selector: the only non-"other" element is
  `postgrest_test_author`, which becomes the role. Upstream asserts the status
  only. NOTE the v16.0 migration (CHANGELOG.md#L131): RFC 9535 has no
  string-comparison operators `^==` / `==^` / `*==`; the equivalent is
  `$.roles[?search(@, "^postgrest_test_")]`, and no upstream fixture exercises
  `search()` end-to-end, so no case is authored for it (see spec/auth.yaml
  gaps). v16.2 (PostgREST#5171) restored the three operators inside the
  deprecated leading-dot syntax only: cases 11702-11706 (parse) and 11820
  (evaluation).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L162
