id: 1533
feature: errors/sqlstate/undefined_column_embed_alias_depth
request:
  method: GET
  path: /factories?select=id,processes(process_costs(banana))
  headers: { Accept: application/json }
schema: test
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: "42703"
    details: null
    hint: null
    message: "column process_costs_2.banana does not exist"
notes: >
  The depth axis of 1531's alias formula: an unknown column two embeds
  down names `process_costs_2`. The suffix is `show depth` (cited line) and
  `process_costs` sits at depth 2 under the root `factories` (depth 0) and
  `processes` (depth 1). A depth-1 case alone cannot tell a depth suffix
  from a per-request sequence number — both read `_1` for a request's first
  embed — and 1532 pins the sibling side; this case pins that nesting moves
  the suffix. The qualifier reaches the message through
  `getQualifiedIdentifier` (QueryBuilder.hs:305), as in 1531.

  EXTRAPOLATION beyond upstream's own coverage, as for 1531. The body was
  read off a live run of the pinned v16.4 binary against this suite's
  fixtures (issue #32).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Plan.hs#L583
