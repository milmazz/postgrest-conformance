id: 11137
feature: select/spread/many-to-many-order-related
request:
  method: GET
  path: /supervisors?select=supervisor:name,...processes(name,...process_costs(cost))&processes.order=process_costs(cost)&order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"supervisor":"Jane","name":[],"cost":[]}
    - {"supervisor":"John","name":["Process B2", "Process A2"],"cost":[70.00, 200.00]}
    - {"supervisor":"Mary","name":["Process B2", "Process A1"],"cost":[70.00, 150.00]}
    - {"supervisor":"Peter","name":["Process C1", "Process C2", "Process B1"],"cost":[40.00, 70.00, 180.00]}
    - {"supervisor":"Sarah","name":["Process B1"],"cost":[180.00]}
notes: >
  An m2m spread's arrays can be ordered by a column of a nested related
  table (processes.order=process_costs(cost)) (SpreadQueriesSpec.hs:589).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L589
