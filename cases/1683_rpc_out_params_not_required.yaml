id: 1683
feature: openapi/rpc/post-body
request:
  method: GET
  path: /
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  body_jsonpath:
    - { path: "$.paths['/rpc/many_out_params'].post.parameters[0].schema", equals: { type: "object" } }
    - { path: "$.paths['/rpc/many_out_params'].post.parameters[0].schema.type", equals: "object" }
    - { path: "$.paths['/rpc/many_out_params'].post.parameters[0].schema.properties", absent: true }
    - { path: "$.paths['/rpc/many_out_params'].post.parameters[0].schema.required", absent: true }
notes: >
  OUT parameters are not request arguments, so a function whose parameters are
  ALL OUT documents an args body schema that carries NEITHER a `properties` key
  NOR a `required` key — only `type: object` survives.
  CORRECTED this pass: the case previously asserted
  `schema.properties` equals `{}`. That was wrong. `test.many_out_params(OUT
  my_json json, OUT num int, OUT str text)` has ZERO input arguments —
  pg_proc.proargtypes is empty for it, and the routines query keeps only
  input arguments (`WHERE type IS NOT NULL -- only input arguments`,
  https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/SchemaCache.hs#L473).
  So `pdParams pd == []` and makeProcSchema's `properties .~ fromList []`
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response/OpenAPI.hs#L174)
  leaves the field at its aeson default (an empty map), exactly as
  `required .~ []`
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Response/OpenAPI.hs#L175)
  leaves that one at its default (an empty list). The swagger2 encoder DROPS
  every field still equal to its default (`| Just x == def = rest` in
  Data/Swagger/Internal/AesonUtils.hs), so neither key is emitted.
  Upstream proves the drop twice in this very spec file, which is why the
  whole-schema equality above is safe to assert: the `a_json` column schema is
  asserted to equal EXACTLY `{"format":"json"}` with no `properties`/`required`
  and no `type`
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/OpenApi/OpenApiSpec.hs#L530
  , the aesonQQ literal running to #L542), and the `child_entities_view`
  definition is asserted as a whole object with no `required` key at all
  (https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/OpenApi/OpenApiSpec.hs#L192
  , running to #L222). `type: object` IS emitted because makeProcSchema sets it
  explicitly with `?~` (OpenAPI.hs#L173), and `description` is absent because
  the fixture carries no COMMENT on the function.
  The `required` assertion is the one upstream states directly:
  OpenApiSpec.hs#L1046-1058 ("doesn't include OUT params of function as
  required parameters") reads
  paths./rpc/many_out_params.post.parameters[0].schema.required and asserts
  Nothing. parameters[0] is the inline `args` body param
  (makeProcPostParams, OpenAPI.hs#L244-252).
  The fixture is the same object upstream uses:
  conformance/fixtures.sql#L1360 declares `test.many_out_params(OUT my_json
  json, OUT num int, OUT str text)`, matching test/spec/fixtures/schema.sql
  #L1259. It carries no explicit GRANT and therefore relies on PostgreSQL's
  default PUBLIC EXECUTE to be visible under the default openapi-mode
  (follow-privileges) to the anonymous role.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/OpenApi/OpenApiSpec.hs#L1046
