id: 11123
feature: select/spread/many-to-many-many-columns
request:
  method: GET
  path: /operators?select=operator:name,...processes(name,category_id)&order=name&processes.order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"operator":"Alfred","name":["Process C2", "Process XX"],"category_id":[2, 2]}
    - {"operator":"Anne","name":["Process A1", "Process A2", "Process B2"],"category_id":[1, 2, 1]}
    - {"operator":"Jeff","name":["Process A2", "Process B1", "Process B2", "Process C2"],"category_id":[2, 1, 1, 2]}
    - {"operator":"Liz","name":[],"category_id":[]}
    - {"operator":"Louis","name":["Process A1", "Process A2"],"category_id":[1, 2]}
notes: >
  Each column selected in an m2m spread becomes its own parallel JSON array
  (SpreadQueriesSpec.hs:359).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L359
