id: 1030
feature: url_grammar/reserved-params/put-offset-forbidden
request:
  method: PUT
  path: /tiobe_pls?name=eq.Javascript&offset=1
  headers:
    Content-Type: application/json
    Accept: application/json
  body: [{ "name": "Javascript", "rank": 1 }]
schema: test
expect:
  status: 400
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    code: PGRST114
    details: null
    hint: null
    message: limit/offset querystring parameters are not allowed for PUT
notes: >-
  The `offset` reserved-embeddable key is rewritten to `limit` while parsing the
  query string (`offsets = first (replaceLast "limit") <$> ...`,
  QueryParams.hs#L192 with `replaceLast` at #L218), so it folds into the same
  top-level range and PUT rejects it with the same PGRST114 envelope as `limit`
  — the message names both parameters. Transcribed from the upstream it-block
  "fails if offset is specified" (UpsertSpec.hs#L394: the it, L395 the
  `put "/tiobe_pls?name=eq.Javascript&offset=1"`, L306 the exact error envelope,
  L307 matchStatus 400 + matchContentTypeJson). Companion to case 1016, which
  covers the `limit` spelling.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/UpsertSpec.hs#L394
