id: 1745
feature: config/ready/no-admin-server
request:
  kind: cli
  flag: "--ready"
schema: config
config:
  env:
    PGRST_ADMIN_SERVER_PORT: ""
expect:
  exit_code: nonzero
  stderr_contains: "ERROR: Admin server is not running. Please check admin-server-port config."
notes: >
  `--ready` with no admin-server-port configured (empty = unset, the
  documented default) exits 1 before any connection attempt. Mirrors
  test_cli.py:test_cli_ready_flag_fail_when_no_admin_server.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/io/test_cli.py#L395
