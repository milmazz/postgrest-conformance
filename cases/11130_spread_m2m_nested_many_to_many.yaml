id: 11130
feature: select/spread/many-to-many-nested-many-to-many
request:
  method: GET
  path: /operators?select=operator:name,...processes(process:name,...supervisors(supervisors:name))&order=name&processes.order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"operator":"Alfred","process":["Process C2", "Process XX"],"supervisors":[["Peter"], []]}
    - {"operator":"Anne","process":["Process A1", "Process A2", "Process B2"],"supervisors":[["Mary"], ["John"], ["Mary", "John"]]}
    - {"operator":"Jeff","process":["Process A2", "Process B1", "Process B2", "Process C2"],"supervisors":[["John"], ["Peter", "Sarah"], ["Mary", "John"], ["Peter"]]}
    - {"operator":"Liz","process":[],"supervisors":[]}
    - {"operator":"Louis","process":["Process A1", "Process A2"],"supervisors":[["Mary"], ["John"]]}
notes: >
  An m2m spread nested inside another m2m spread (two junctions deep)
  yields an array of arrays (SpreadQueriesSpec.hs:446).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L446
