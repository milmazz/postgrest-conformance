id: 11100
feature: select/spread/one-to-many-arrays
request:
  method: GET
  path: /factories?select=factory:name,...processes(name)&order=name
  headers: { Accept: application/json }
schema: test
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
  body_exact:
    - {"factory":"Factory A","name":["Process A1", "Process A2"]}
    - {"factory":"Factory B","name":["Process B1", "Process B2"]}
    - {"factory":"Factory C","name":["Process C1", "Process C2", "Process XX", "Process YY"]}
    - {"factory":"Factory D","name":[]}
notes: >
  Spreading a one-to-many relationship flattens each selected child column
  into a JSON array on the parent; a parent with no children gets an empty
  array (SpreadQueriesSpec.hs:93). The same it-block's second get (L104)
  asserts the aliased form.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L93
