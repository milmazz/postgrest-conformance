id: 1331
feature: representations/put/single-upsert-replace-200
request:
  method: PUT
  path: /items?id=eq.1
  headers:
    Prefer: "return=representation"
    Content-Type: application/json
  body: [{ "id": 1 }]
schema: representations
expect:
  status: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Preference-Applied: "return=representation"
  body_exact: [{ "id": 1 }]
notes: >-
  PUT single upsert that REPLACES an existing row (PK already present, 0 newly
  inserted) with return=representation yields 200 + JSON array body. Status
  semantics (not inserted => 200) per Response.hs#L156-L161. The
  Preference-Applied: return=representation echo is asserted upstream on the
  PUT-replace it-block "works with request method PUT and embedded resource"
  (UpsertSpec.hs#L678-L689: matchStatus 200 plus "Preference-Applied" <:>
  "return=representation"); the simpler PUT-update it-block at
  UpsertSpec.hs#L529-L539 asserts only the JSON body. Mechanically the echo comes
  from responsePreferences passing preferRepresentation through for any
  MutateReadPlan{} (Response.hs#L288-L290) and the SingleUpsert dispatch emitting
  it via prefAppliedHeader (Response.hs#L151,L161).
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/UpsertSpec.hs#L678
