id: 1269
feature: pagination/count/exact_empty_body
request:
  method: GET
  path: /items?id=eq.0
  headers:
    Accept: application/json
    Prefer: count=exact
schema: pagination
expect:
  status: 200
  headers:
    Content-Range: "*/0"
  body_exact: []
notes: >
  count=exact over a filtered-out result returns [] with Content-Range '*/0',
  status 200 (window equals total of 0). Mirrors the it-block at
  RangeSpec.hs:187 — inside the context "count with an empty body" at :186 —
  whose request is at :188, whose 'Prefer: count=exact' header is at :191 and
  whose asserted `"Content-Range" <:> "*/0"` is at :194.
source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RangeSpec.hs#L187
