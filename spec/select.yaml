    source_line: 614
    cases: [1106]

  # --- JSON paths ----------------------------------------------------------
  - entry_id: select.json_arrow_text_key
    claim: >
      `->` navigates into a json/jsonb subfield keeping json type; `->>`
      extracts the field as text. The last segment's key becomes the JSON key
      unless aliased. Two-level path `settings->foo->>bar`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L32
    source_line: 32
    cases: [1107]

  - entry_id: select.json_path_with_cast
    claim: >
      A JSON path may be followed by a cast: `settings->foo->>int::integer`
      returns the extracted text coerced to the target type.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L42
    source_line: 42
    cases: [1108]

  - entry_id: select.json_path_alias
    claim: >
      A JSON path can be aliased: `select=<alias>:settings->foo->>bar`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L37
    source_line: 37
    cases: [1109]

  - entry_id: select.json_array_index
    claim: >
      A non-negative integer segment in a JSON path is treated as an array
      index: `data->>0::int` extracts element 0 as text then casts.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L96
    source_line: 96
    cases: [1110]

  - entry_id: select.json_bad_syntax
    claim: >
      Malformed JSON path syntax in select yields HTTP 400 with code PGRST100
      and a "failed to parse select parameter" message.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L308
    source_line: 308
    cases: [1111]

  # --- composite / array columns via the arrow operators -------------------
  # Distinct from the json/jsonb entries above: the target column is NOT of a
  # json type, so PostgREST wraps it as `to_jsonb(<col>)` before applying the
  # path (SqlFragment.pgFmtField, cfToJson branch — same wrapping the ordering
  # area notes on cases 1219/1225). Documented as "Composite / Array Columns"
  # (docs/references/api/tables_views.rst:347, published at
  # https://postgrest.org/en/v16/references/api/tables_views.html#composite-array-columns).
  - entry_id: select.composite_array_arrow
    claim: >
      `->` / `->>` also address a *field of a composite-type column*:
      `fav_numbers?select=num->i` yields `{"i":0.5}` (json value) and
      `num->>i` yields `{"i":"0.5"}` (text). The last path segment becomes the
      JSON key unless aliased. The column is not json/jsonb, so it is wrapped
      in `to_jsonb(...)` first.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L150
    source_line: 150
    cases: [1143, 1144]

  - entry_id: select.composite_array_arrow_item
    claim: >
      The array half of the same feature, modeled separately from
      select.json_array_index (which addresses an index inside a *json* column):
      a numeric arrow segment addresses an element of an `int[]`/`int[][]`
      column. `arrays?select=a:numbers->0,b:numbers->1,c:numbers_mult->0->0,d:numbers_mult->1->2`
      yields json numbers; the `->>` variants yield the same elements as text.
      Multi-dimensional arrays are chained (`numbers_mult->0->0`), because
      `to_jsonb(int[][])` produces nested JSON arrays.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/JsonOperatorSpec.hs#L158
    source_line: 158
    cases: [1145, 1146]

  # --- embeds: many-to-one -------------------------------------------------
  - entry_id: select.embed_many_to_one
    claim: >
      Embedding a parent (many-to-one) returns the related row as a JSON
      object (or null when the FK is null). `projects?select=id,name,clients(*)`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L628
    source_line: 628
    cases: [1112]

  - entry_id: select.embed_missing_parent_null
    claim: >
      Rows whose FK has no matching parent still appear, with the embed set to
      null (default left join).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L665
    source_line: 665
    cases: [1113]

  # --- embeds: one-to-many -------------------------------------------------
  - entry_id: select.embed_one_to_many
    claim: >
      Embedding children (one-to-many) returns a JSON array. Rows with no
      children get an empty array `[]`, not null.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L670
    source_line: 670
    cases: [1114]

  - entry_id: select.embed_nested_two_levels
    claim: >
      Embeds nest arbitrarily: `clients?select=id,projects(id,tasks(id))`
      returns children-of-children.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L674
    source_line: 674
    cases: [1115]

  - entry_id: select.embed_alias
    claim: >
      An embedded resource can be aliased with `<alias>:<relation>(...)`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L656
    source_line: 656
    cases: [1116]

  # --- embed alias vs. target name in filters/orders/limits (NEW in v16.0) --
  #
  # v16.0 adds the `url-use-legacy-target-names` config key (default `true`,
  # PostgREST/Config.hs `<*> (fromMaybe True <$> optBool
  # "url-use-legacy-target-names")`). It decides how the `<name>.` prefix of a
  # filter/order/limit resolves to a node of the read plan:
  #   legacy (true):  relName == name || relAlias == Just name   (v14.12 rule)
  #   strict (false): fromMaybe relName relAlias == name
  # See Plan.hs `matchTarget` (v16.0 src/library/PostgREST/Plan.hs#L1027-L1030).
  - entry_id: select.embed_alias_legacy_target_name_warning
    claim: >
      NEW in v16.0. Under the default `url-use-legacy-target-names = true`, a
      filter/order/limit may still address an aliased embed by its relation
      name (`the_tasks:tasks(...)` + `tasks.order=...`), but the response now
      carries a deprecation header
      `Warning: 299 <product-version> "Embedded resource was referenced by
      relation name even though it has an alias. This is deprecated and will
      stop working in a future release. Update `<relName>` to `<alias>` in
      query string filters, orders or limits."`. Multiple offending nodes are
      joined with ", " in the "Update ..." clause (App.hs legacyWarnHint,
      v16.0 src/library/PostgREST/App.hs#L214).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1183
    source_line: 1183
    cases: [1138]

  - entry_id: select.embed_alias_reference_no_warning
    claim: >
      Addressing an aliased embed by its ALIAS is the supported form and emits
      no `Warning` header: `readPlanWarning` only fires for a node whose
      `relIsLegacyTargetNameMatch` flag is set, and `updateLegacyAttrs` sets it
      only when the addressed name equals the relation name AND differs from
      the alias (Plan.hs#L1032-L1036).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/src/library/PostgREST/Plan.hs#L167
    source_line: 167
    note: >-
      Implementation anchor (this claim is about the mechanism). The black-box
      demonstration — the same request/response as case 1141 — is the it-block
      `it "ordering embeded entities with alias"` at
      test/spec/Feature/Query/QuerySpec.hs#L1159, which is what case 1141
      cites as its `source`.
    cases: [1141]

  - entry_id: select.embed_alias_target_name_disallowed
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names = false`, addressing an
      aliased embed by its relation name is HTTP 400 PGRST108 with
      message "'<relName>' is not an embedded resource in this request",
      details "Target names are not allowed in filters if they have an alias"
      and hint "Change '<relName>' to '<alias>' in filters, orders or limits."
      (Error.hs#L214/#L220). The pre-existing not-embedded-at-all form of
      PGRST108 is unchanged: details null, hint "Verify that '<name>' is
      included in the 'select' query parameter."
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1709
    source_line: 1709
    cases: [1139]

  - entry_id: select.embed_same_table_twice_independent_filters
    claim: >
      NEW in v16.0. With `url-use-legacy-target-names = false`, the same
      relation may be embedded more than once (once plain, once aliased) and
      each `<name>.` filter/order/limit resolves to exactly one node, so the
      two embeds can be filtered independently. Under the legacy rule both
      filters collapse onto whichever node `find` matched first.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L1699
    source_line: 1699
    cases: [1140]

