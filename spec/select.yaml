    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedInnerJoinSpec.hs#L35
    source_line: 35
    cases: [1121]

  # --- disambiguation hints ------------------------------------------------
  - entry_id: select.embed_by_fk_name
    claim: >
      An FK constraint name is itself a valid embed target: the projects ->
