    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedInnerJoinSpec.hs#L109
    source_line: 109
    cases: [1120]

  - entry_id: select.embed_inner_filter_propagates
    claim: >
      A filter on an `!inner` embedded table filters the source table rows as
