    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L729
    source_line: 729
    cases: [1135]

  # --- embeds: many-to-many ------------------------------------------------
  - entry_id: select.embed_many_to_many
    claim: >
      A many-to-many relationship through a junction table is embedded as a
