    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L244
    source_line: 244
    note: >-
      Split out of the former combined `select.hint_by_fk_name` entry, which
