    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L175
    source_line: 175
    cases: [1122]

  - entry_id: select.hint_by_fk_name
    claim: >
      An embed can be disambiguated by FK constraint name with the
      `<relation>!<fk>(...)` hint form, e.g.
      `clients?select=id,projects:projects!client(id,tasks(id))`, and the
