    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L255
    source_line: 255
    cases: [1123]

  - entry_id: select.hint_unknown_fk
    claim: >
      An embed hint that does not match any relationship yields HTTP 400 with
      code PGRST200 ("Could not find a relationship ... using the hint ...").
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L216
    source_line: 216
    cases: [1124]

  - entry_id: select.ambiguous_300
    claim: >
      When more than one relationship matches an embed, PostgREST returns HTTP
      300 Multiple Choices with code PGRST201, a `details` array enumerating
      candidate relationships, and a `hint` listing disambiguated targets.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedDisambiguationSpec.hs#L14
    source_line: 14
    cases: [1125]

  # --- spread embeds -------------------------------------------------------
  - entry_id: select.spread_many_to_one
    claim: >
      `...<relation>(...)` spreads a to-one embed's columns into the parent
      object instead of nesting them under a key.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L13
    source_line: 13
    cases: [1126]

  - entry_id: select.spread_one_to_many_arrays
    claim: >
      Spreading a one-to-many relationship flattens each selected child column
      into a JSON array on the parent (e.g. names of all child processes); a
      parent with no children gets an empty array.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L93
    source_line: 93
    cases: [11100]

  - entry_id: select.spread_to_many_parallel_columns
    claim: >
      Every column selected in a spread to-many becomes its own parallel JSON
      array (element i of each array belongs to the same child row); `*`
      spreads all child columns this way.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L114
    source_line: 114
    note: >-
      The all-columns flavor is its own it-block at L151 (case 11104).
    cases: [11101, 11104]

  - entry_id: select.spread_to_many_empty_array
    claim: >
      A spread to-many with no matching children yields an empty array, and
      the embed is filterable with `<embed>=is.null`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L135
    source_line: 135
    cases: [11102]

  - entry_id: select.spread_to_many_null_element
    claim: >
      When the child row exists but the selected value is null, the spread
      array contains a single null element — distinct from the empty array of
      the no-children case.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L143
    source_line: 143
    cases: [11103]

  - entry_id: select.spread_to_many_nested_spread
    claim: >
      A spread nested inside a spread to-many joins the parallel arrays: a
      nested to-one contributes one element per intermediate child (null
      where the nested row is missing); a nested to-many contributes an
      array of arrays.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L162
    source_line: 162
    note: >-
      One it-block per nested cardinality: one-to-one at L162 (11105),
      many-to-one at L173 (11106), one-to-many at L184 (11107),
      many-to-many at L195 (11108).
    cases: [11105, 11106, 11107, 11108]

  - entry_id: select.spread_to_many_nested_non_spread
    claim: >
      A NON-spread embed nested inside a spread to-many renders as an array
      of objects (to-one; null where missing) or an array of arrays
      (to-many), not as flattened value arrays.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L206
    source_line: 206
    note: >-
      The one-to-one flavor (L206) is cased; the many-to-one (L217),
      one-to-many (L228) and many-to-many (L239) flavors are traced but not
      cased — same rendering rule, different cardinality.
    cases: [11109]

  - entry_id: select.spread_to_many_filters
    claim: >
      Filters on the spread embed narrow the arrays without dropping parents;
      `!inner` (or `<embed>=not.is.null`) drops parents with no children.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L261
    source_line: 261
    note: >-
      Column filters at L261 (11110); !inner and its not.is.null equivalent
      share the it-block at L272 (11111 transcribes the !inner get).
    cases: [11110, 11111]

  - entry_id: select.spread_to_many_ordering
    claim: >
      `<embed>.order=` orders every resulting array in lockstep by the spread
      relationship's ordering columns — selected or not — and can order by a
      column of a nested related table (`processes.order=process_costs(cost)`,
      missing nested rows sorting as null).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L291
    source_line: 291
    note: >-
      Ordering columns selected at L291 (11112), unselected at L312 (11113),
      related-table at L323 (11114). L291's second get (L302) additionally
      exercises JSON-path ordering columns on factory_buildings — traced,
      not cased in this one-to-many flavor; the m2m twin of the JSON-path
      rule IS cased (11135, SpreadQueriesSpec.hs#L563).
    cases: [11112, 11113, 11114]

  - entry_id: select.spread_many_to_many_arrays
    claim: >
      Spreading a many-to-many relationship (through a junction) flattens
      each selected far-table column into a parallel JSON array on the
      parent — empty for a parent with no junction rows; `*` spreads all
      far-table columns and no junction columns.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L336
    source_line: 336
    note: >-
      Single column at L336 (11122), many columns at L359 (11123), `*` at
      L398 (11126).
    cases: [11122, 11123, 11126]

  - entry_id: select.spread_m2m_empty_vs_null
    claim: >
      On an m2m spread, no junction rows yields an empty array (filterable
      via is.null), while an existing far row whose nested spread value is
      null yields a single-null-element array.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L382
    source_line: 382
    note: >-
      Empty at L382 (11124); null element at L390 (11125 — transcribed
      verbatim including upstream's stray trailing `)` in the select tree,
      which v16.0 accepts).
    cases: [11124, 11125]

  - entry_id: select.spread_m2m_nested
    claim: >
      A spread nested inside an m2m spread joins the parallel arrays with
      the same shapes as the one-to-many flavor: nested to-one contributes
      one element per far row (null where missing), nested to-many an
      array of arrays.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L410
    source_line: 410
    note: >-
      One it-block per nested cardinality: one-to-one at L410 (11127),
      many-to-one at L422 (11128), one-to-many at L434 (11129),
      many-to-many at L446 (11130). Non-spread nested one-to-one at L458
      (11131, array of objects); the non-spread m2o/o2m/m2m renderings
      (L470/L482/L494) and nested `*` (L506) are traced, not cased.
    cases: [11127, 11128, 11129, 11130, 11131]

  - entry_id: select.spread_m2m_filters
    claim: >
      Filters on an m2m spread embed narrow the arrays without dropping
      parents; `!inner` (or not.is.null) drops parents with no junction
      rows.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L518
    source_line: 518
    note: >-
      Column filters at L518 (11132); !inner at L530 (11133, whose second
      get L541 asserts the not.is.null equivalent).
    cases: [11132, 11133]

  - entry_id: select.spread_m2m_ordering
    claim: >
      `<embed>.order=` on an m2m spread orders every array in lockstep —
      by spread columns (selected or not), by JSON paths with nulls
      handling (`status->afk.asc.nullsfirst`), or by a column of a nested
      related table.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L551
    source_line: 551
    note: >-
      Spread columns at L551 (11134); JSON-path at L563 (11135 — anchor is
      the it-block's second get, the only one demonstrating that flavor);
      unselected at L577 (11136); related-table at L589 (11137).
    cases: [11134, 11135, 11136, 11137]

  - entry_id: select.spread_empty
    claim: >
      An empty spread `...relation()` contributes no keys — the same
      result as an empty embed, one row per parent.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L603
    source_line: 603
    note: >-
      11138 transcribes the it-block's factories get (L624); the
      actors/films get (L604) needs a still-absent fixture pair and the
      grandchild_entities get (L611) is traced, not cased.
    cases: [11138]

  - entry_id: select.spread_drop_junction
    claim: >
      In a many-to-many embed, spreading the far table inside the junction
      embed (`users_tasks(...tasks(*))`) drops the junction columns from the
      output rows.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/SpreadQueriesSpec.hs#L78
    source_line: 78
    note: >-
      Deviates from the file-header convention: L78 is the second `get` inside
      the it-block `it "can include or exclude attributes of the junction on a
      m2m"` (SpreadQueriesSpec.hs:64), not the `it` line. The it-block covers
      both the keep-junction (`users_tasks(*,...tasks(*))`, L65) and
      drop-junction (`users_tasks(...tasks(*))`, L78) forms; L78 is anchored
      because only it demonstrates this claim.
    cases: [1127]

  # --- computed columns ----------------------------------------------------
  - entry_id: select.computed_column
    claim: >
      A computed column (SQL function taking the table row type) can be
      selected like a normal column: `items?select=id,always_true`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/QuerySpec.hs#L766
    source_line: 766
    cases: [1128]

  # --- computed relationships ----------------------------------------------
  - entry_id: select.computed_rel_many_to_one
    claim: >
      A computed relationship defined by a SETOF-returning function (with ROWS 1)
      on a table's row type, e.g. computed_designers(test.videogames), is
      embeddable like a real relationship and returns a single JSON object for
      the many-to-one case. Supports aliasing (`designer:computed_designers`).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ComputedRelsSpec.hs#L13
    source_line: 13
    cases: [1136]

  - entry_id: select.computed_rel_inner_filter
    claim: >
      A computed relationship supports `!inner` and filtering on the embedded
      resource; the embedded filter propagates to the source table and
      count=exact reports the filtered total.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/ComputedRelsSpec.hs#L49
    source_line: 49
    cases: [1137]

  # --- aggregate functions (require db-aggregates-enabled = true) ----------
  - entry_id: select.agg_count_no_field
    claim: >
      `select=count()` returns the count of all rows under key "count" when no
      other field is selected. Alias and cast apply (`cnt:count()`,
      `count()::text`).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L16
    source_line: 16
    cases: [1129]

  - entry_id: select.agg_function_on_field
    claim: >
      `select=<col>.sum()` (also avg/min/max/count) aggregates a field; the
      JSON key is the aggregate name unless aliased.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L38
    source_line: 38
    cases: [1130]

  - entry_id: select.agg_group_by_plain_fields
    claim: >
      Plain (non-aggregated) fields selected alongside an aggregate become an
      implicit GROUP BY; one result row per distinct group.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L53
    source_line: 53
    cases: [1131]

  - entry_id: select.agg_alias_and_cast
    claim: >
      Aggregates support an output alias and a result cast:
      `total_charged:invoice_total.sum()::text` ("allows you to cast the result
      of the aggregate"); the alias-only form is at L69.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L76
    source_line: 76
    cases: [1132]

  - entry_id: select.agg_cast_aggregated_column
    claim: >
      Distinct from casting the aggregate's *result* (entry
      select.agg_alias_and_cast): a cast placed on the field **before** the
      `.agg()` suffix casts the aggregate's INPUT argument —
      `trash_details?select=jsonb_col->>key::integer.sum()` sums the text
      extracted by `->>` after coercing it to integer, yielding
      `[{"sum":24}]`. Alias, input cast and result cast combine:
      `s:jsonb_col->>key::integer.sum()::text` -> `[{"s":"24"}]` (L86).
      Documented as "Casting the Aggregated Column"
      (docs/references/api/aggregate_functions.rst:106).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L83
    source_line: 83
    cases: [1147, 1148]

  - entry_id: select.agg_group_by_embed
    claim: >
      A JSON-embedded relationship may participate in the implicit GROUP BY:
      `project_invoices?select=project_id,total:invoice_total.sum(),projects(name)&order=project_id`
      returns one row per group with the many-to-one embed rendered as a JSON
      object alongside the aggregate. Distinct from
      select.agg_group_by_plain_fields (plain columns only) and from
      select.agg_in_embed (the aggregate living *inside* the embed).
      Documented as "Grouping by an Embedded Resource"
      (docs/references/api/aggregate_functions.rst:147).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L92
    source_line: 92
    cases: [1149]

  - entry_id: select.agg_in_embed
    claim: >
      Aggregates apply within an embedded resource:
      `projects?select=name,project_invoices(invoice_total.sum())`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L100
    source_line: 100
    cases: [1133]

  - entry_id: select.agg_spread_to_one
    claim: >
      Aggregates apply to fields spread from a to-one embed
      (`...budget_categories(budget_owner,total_budget:budget_amount.sum())`);
      plain spread fields join the implicit GROUP BY, and with only
      aggregates supplied a single row aggregates over everything.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L145
    source_line: 145
    note: >-
      The only-aggregates flavor is its own it-block at L152 (case 11116).
      Documented as "Aggregates in To-One Spreads"
      (docs/references/api/aggregate_functions.rst).
    cases: [11115, 11116]

  - entry_id: select.agg_spread_group_by_other_spread
    claim: >
      An aggregate on one to-one spread may be grouped by a plain field
      spread from a different relationship
      (`...process_costs(cost.sum()),...process_categories(name)`).
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L156
    source_line: 156
    note: >-
      Deeper flavors — nested-relationship spreads (L167-L228) — are traced
      but not cased; same mechanism, longer chains.
    cases: [11117]

  - entry_id: select.agg_spread_count_no_field
    claim: >
      `count()` without a field works inside a to-one spread, grouped by the
      parent's plain columns.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L231
    source_line: 231
    note: >-
      L231 sits inside the context at L230; the alongside-other-columns
      (L246), nested (L261-L288) and multi-level (L289) flavors are traced
      but not cased.
    cases: [11118]

  - entry_id: select.agg_spread_to_many_unsupported
    claim: >
      Even with db-aggregates-enabled=true, an aggregate inside a to-many
      (one-to-many or many-to-many) spread returns HTTP 400 with code
      PGRST127 "Feature not implemented".
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L298
    source_line: 298
    cases: [11119]

  - entry_id: select.agg_disallowed
    claim: >
      When db-aggregates-enabled is false (PostgREST default), use of an
      aggregate function returns HTTP 400 with code PGRST123 ("Use of aggregate
      functions is not allowed") — on a plain select, inside an embed, and
      inside spreads.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/AggregateFunctionsSpec.hs#L312
    source_line: 312
    note: >-
      Plain form at L312 (11120), to-one spread at L334 (11121); the
      embedded (L323) and to-many spread (L345) flavors are traced but not
      cased — same guard, same body.
    cases: [11120, 11121]

