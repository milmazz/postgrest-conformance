      the shared "ignores null embeddings while the default left join doesn't"
      it-block (its `it` line is L16). L22 is cited because it is the exact line
      demonstrating `!left`.
    source_url: https://raw.githubusercontent.com/PostgREST/postgrest/v16.0/test/spec/Feature/Query/EmbedInnerJoinSpec.hs#L22
    source_line: 22
    cases: [1119]

  - entry_id: select.embed_inner_o2m
    claim: >
      For one-to-many, `!inner` drops source rows whose child array would be
