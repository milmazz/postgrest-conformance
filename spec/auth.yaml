# Behavior model: auth (JWT verification, role switching, GUCs)
# PostgREST version pinned: v16.4 (re-pinned from v16.0 on 2026-10-02)  (re-synced from v14.12)
#
# Every entry carries a `source` URL with a line anchor into PostgREST's own
# test suite or source. Behaviors that could not be traced to a real source
# line are recorded under `gaps` at the bottom, NOT invented.
#
# Ground-truth priority: PostgREST tests > PostgREST source > docs.
#
# NOTE on source paths: v16.0 moved the library sources from `src/PostgREST/**`
# to `src/library/PostgREST/**`, and split the error ADTs out into
# `src/library/PostgREST/Error/Types.hs`. Every `src/` anchor below was
# re-verified against the v16.0 tree, not mechanically rewritten.

area: auth
version: v16.4

# ===========================================================================
# JWT signature verification & supported algorithms
# ===========================================================================
jwt_verification:
  # The Authorization header carries `Bearer <token>`; both "Bearer" and
  # "bearer" scheme spellings are accepted.
  bearer_scheme_case_insensitive:
    accepted: ["Bearer", "bearer"]
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L258
  algorithms:
    # jwt-secret is parsed as a JWKS, a single JWK, or (fallback) a symmetric
    # HS* secret. A plain text secret yields an HS256 SymmetricJwk.
    symmetric_text_secret_is_hs256: true
    symmetric_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L602
    # A symmetric (HS*) secret must be at least 32 characters long.
    symmetric_min_length: 32
    symmetric_min_length_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L604
    # HS256 verification of a token signed with the configured text secret.
    hs256_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L86
    # A binary (base64) symmetric secret also verifies an HS256 token.
    binary_secret_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/BinaryJwtSecretSpec.hs#L21
    # Asymmetric verification: a token signed with RS256 verifies against the
    # configured public JWK (server started with an asymmetric JWK).
    rs256_asymmetric_jwk_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AsymmetricJwtSpec.hs#L28
    # NEW in v16.0: the same RS256 token also verifies when jwt-secret is a JWK
    # *Set* (`{"keys":[ ... ]}`) rather than a bare JWK. v14.12 only exercised
    # the bare-JWK form.
    rs256_asymmetric_jwks_verifies:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AsymmetricJwtSpec.hs#L39
    # jwt-secret accepts a JWK or a JWKS (JSON Web Key Set) document; the JWKS
    # form is used as-is so ES256 / EdDSA / multi-key sets are supported by the
    # underlying jose library. Only RS256/HS256 are exercised by upstream tests;
    # ES256/EdDSA are library-supported but not test-anchored (see gaps).
    jwks_accepted: true
    jwks_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L585
  cache:
    # jwt-cache-max-entries (default 1000) caches verified claim sets. Its only
    # black-box observable is that requests keep working with the cache on;
    # v16.0 added Feature/Auth/JwtCacheSpec.hs, which asserts (a) the `jwt`
    # Server-Timing metric is emitted for cached tokens with and without `exp`
    # and (b) requests still succeed when server-timing is disabled.
    config_key: jwt-cache-max-entries
    default: 1000
    default_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L342
    works_with_server_timing_disabled:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/JwtCacheSpec.hs#L55
    server_timing_metric_with_exp:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/JwtCacheSpec.hs#L18
    server_timing_metric_without_exp:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/JwtCacheSpec.hs#L34
  errors:
    # No JWT secret configured but a token is presented -> 500 PGRST300.
    secret_missing: {status: 500, code: PGRST300, message: "Server lacks JWT secret"}
    secret_missing_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/NoJwtSecretSpec.hs#L21
    # Empty token in Authorization header -> 401 PGRST301.
    empty_token: {status: 401, code: PGRST301, message: "Empty JWT is sent in Authorization header"}
    empty_token_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L99
    # Token without exactly 3 dot-separated parts -> 401 PGRST301, message
    # "Expected 3 parts in JWT; got N".
    wrong_parts: {status: 401, code: PGRST301, message: "Expected 3 parts in JWT; got 2"}
    wrong_parts_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L123
    # Re-asserted verbatim by the v16.0 ErrorSpec "JWT Token format errors"
    # block (see decode_errors below).
    wrong_parts_source_alt: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L206
    # All PGRST301 / PGRST303 decode/claims errors carry a WWW-Authenticate
    # header: Bearer error="invalid_token", error_description="<message>".
    invalid_token_header_format: 'Bearer error="invalid_token", error_description="<message>"'
    invalid_token_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L684
  # -------------------------------------------------------------------------
  # Decode-stage failures (jose `JWT.decode` errors), NEW as black-box
  # assertions in v16.0.
  #
  # At the v14.12 pin these three were asserted only by the process-level io
  # suite (test/io/test_auth.py::test_jwt_errors, deleted in v16.0); v16.0 moved
  # them into the hspec suite as Feature/Query/ErrorSpec.hs "JWT Errors" /
  # "Test JWT Token format errors", which pins the full response envelope. The
  # behavior itself did not change between the pins — only its ground-truth
  # tier did (io test -> black-box test), which is why cases exist for them now.
  #
  # All three are PGRST301/401; `details` is what distinguishes them.
  # -------------------------------------------------------------------------
  decode_errors:
    dispatch_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L105
    details_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L676
    # Structurally valid token whose signature does not verify under any
    # configured key -> jose KeyError. `details` carries jose's message.
    wrong_secret:
      status: 401
      code: PGRST301
      message: "No suitable key or wrong key type"
      details: "None of the keys was able to decode the JWT"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L116
    # Three parts of garbage -> jose BadCrypto. No details.
    bad_crypto:
      status: 401
      code: PGRST301
      message: "JWT cryptographic operation failed"
      details: null
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L218
    # `alg: none` (unsecured JWT) -> jose BadAlgorithm. `details` carries jose's
    # message. An unsigned token must never authenticate.
    algorithm_none:
      status: 401
      code: PGRST301
      message: "Wrong or unsupported encoding algorithm"
      details: "JWT is unsecured but expected 'alg' was not 'none'"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L230
  error_codes:
    # Canonical JWT error code -> message map (source of truth). Unchanged
    # between v14.12 and v16.0; only the file location moved.
    PGRST300: "Server lacks JWT secret"
    PGRST301: "Empty JWT is sent in Authorization header | Expected 3 parts in JWT; got N | No suitable key or wrong key type | Wrong or unsupported encoding algorithm | JWT cryptographic operation failed | Unsupported token type | JWT couldn't be decoded"
    PGRST302: "Anonymous access is disabled"
    PGRST303: "JWT expired | JWT not yet valid | JWT issued at future | JWT not in audience | Parsing claims failed | The JWT 'exp' claim must be a number | The JWT 'nbf' claim must be a number | The JWT 'iat' claim must be a number | The JWT 'aud' claim must be a string or an array of strings"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L649
    # The error ADTs themselves moved to their own module in v16.0.
    types_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error/Types.hs#L92

# ===========================================================================
# Standard-claim validation (exp / nbf / iat / aud) -> all PGRST303
# ===========================================================================
claim_validation:
  # All time claims are compared against `now` with a fixed 30-second clock-skew
  # allowance: `exp` fails only when now - 30s > exp; `nbf`/`iat` fail only when
  # now + 30s < claim.
  clock_skew_seconds: 30
  clock_skew_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L70
  # Expired token (exp in the past) -> 401 PGRST303 "JWT expired".
  expired: {status: 401, code: PGRST303, message: "JWT expired"}
  expired_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L112
  # v16.0 re-asserts the same error at the skew boundary (exp = now - 35s), in
  # the new ErrorSpec "we allow 30 seconds clock skew" context.
  expired_skew_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L145
  # A far-future exp verifies.
  unexpired_ok:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L86
  # NEW in v16.0: a numeric iat that is not in the future verifies.
  iat_valid_ok:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L91
  # nbf numerically in the future (beyond the 30s skew) -> 401 PGRST303.
  # NEW as a black-box assertion in v16.0: at v14.12 this lived only in
  # test/io/test_auth.py::test_jwt_errors, which v16.0 deleted after moving the
  # assertion into ErrorSpec's "we allow 30 seconds clock skew" context.
  nbf_future: {status: 401, code: PGRST303, message: "JWT not yet valid"}
  nbf_future_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L160
  nbf_future_impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L65
  # iat numerically in the future (beyond the 30s skew) -> 401 PGRST303.
  # Same provenance as nbf_future.
  iat_future: {status: 401, code: PGRST303, message: "JWT issued at future"}
  iat_future_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L175
  iat_future_impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L66
  # exp claim present but not a number -> 401 PGRST303.
  exp_not_number: {status: 401, code: PGRST303, message: "The JWT 'exp' claim must be a number"}
  exp_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L151
  # nbf claim present but not a number -> 401 PGRST303.
  nbf_not_number: {status: 401, code: PGRST303, message: "The JWT 'nbf' claim must be a number"}
  nbf_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L165
  # iat claim present but not a number -> 401 PGRST303.
  iat_not_number: {status: 401, code: PGRST303, message: "The JWT 'iat' claim must be a number"}
  iat_not_number_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L179
  # aud as a single non-string value -> 401 PGRST303.
  aud_not_string: {status: 401, code: PGRST303, message: "The JWT 'aud' claim must be a string or an array of strings"}
  aud_not_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L193
  # aud as an array with a non-string element -> 401 PGRST303.
  aud_array_non_string: {status: 401, code: PGRST303, message: "The JWT 'aud' claim must be a string or an array of strings"}
  aud_array_non_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L207
  # A token with no claims at all -> 401 (no role claim to switch to).
  no_claims_unauthorized: {status: 401}
  no_claims_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L134
  # A token whose claims contain no `role` -> 401.
  no_role_claim_unauthorized: {status: 401}
  no_role_claim_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L139
  # Claim checks run in this order, all before role extraction.
  order: [exp, nbf, iat, aud]
  order_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L62

# ===========================================================================
# Audience (aud) handling, gated by the jwt-aud config option
# ===========================================================================
audience:
  config_key: jwt-aud
  config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L334
  # With jwt-aud unset, `audMatchesCfg` degenerates to `const True`, so every
  # aud value matches.
  unset_matches_everything_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L84
  # jwt-aud must parse as a string or a valid URI, else startup fails.
  invalid_value_message: "jwt-aud should be a string or a valid URI"
  invalid_value_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L502
  when_jwt_aud_set:
    # String aud matching the configured value -> 200.
    string_match_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L24
    # String aud not matching -> 401 PGRST303 "JWT not in audience".
    string_mismatch: {status: 401, code: PGRST303, message: "JWT not in audience"}
    string_mismatch_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L37
    # v16.0 adds a second, independent assertion of the same error in
    # ErrorSpec's "Test JWT Audience error" block (jwt-aud = "spec tests").
    string_mismatch_source_alt: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L191
    # Empty string aud -> treated as a non-matching value -> 401.
    empty_string_mismatch: {status: 401, code: PGRST303, message: "JWT not in audience"}
    empty_string_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L53
    # Single-element array aud containing the configured value -> 200. Its own
    # upstream it-block, distinct from the multi-element match below (case 11817).
    array_single_match_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L70
    # Array aud containing the configured value (any position) -> 200.
    array_contains_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L84
    # Single-element array aud NOT containing the configured value -> 401. The
    # negative counterpart of array_single_match_ok, and its own upstream
    # it-block distinct from array_no_match below (case 11818). A one-element
    # array must not be conflated with the ignored empty-array branch.
    array_single_no_match: {status: 401, code: PGRST303, message: "JWT not in audience"}
    array_single_no_match_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L98
    # Array aud (multi-element) not containing the configured value -> 401.
    array_no_match: {status: 401, code: PGRST303, message: "JWT not in audience"}
    array_no_match_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L114
    # Empty array aud -> audience ignored -> 200 (`null auds || any ...`).
    empty_array_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L130
    empty_array_impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L82
    # Explicit `aud: null` -> audience ignored -> 200. Own it-block, distinct
    # from empty_array_ignored (case 11816).
    null_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L144
    # Absent aud claim: the audience check is SKIPPED entirely (the claims
    # decoder does `parseMaybe (.:? "aud")`, so a missing key yields Nothing and
    # `audMatchesCfg` is never applied) -> 200. This is NOT the same as the
    # no-JWT branch below, which short-circuits before claim validation
    # (case 11815 vs case 1494).
    absent_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L159
    absent_impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L90
    absent_check_site_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L67
    # No JWT at all -> the audience check never runs -> 200.
    no_jwt_ok:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L172
  when_jwt_aud_unset:
    # With no jwt-aud configured, any aud value is ignored -> 200.
    any_aud_ignored:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AudienceJwtSecretSpec.hs#L178

# ===========================================================================
# Role switching & anonymous access
# ===========================================================================
role_switching:
  # BREAKING CHANGE in v16.0: `jwt-role-claim-key` no longer uses PostgREST's
  # own JSPath DSL; it is now standard RFC 9535 JSON Path. Every value must
  # start with `$`, keys with characters other than `_` must use the bracket
  # selector, and the DSL's string-comparison operators (`^==`, `==^`, `*==`)
  # are gone, replaced by `search(@, "<regex>")`.
  # PARTLY REVERSED in v16.2 (PostgREST#5171): a value the RFC 9535 parser
  # rejects is retried as the old DSL and, if that parses, kept as DEPRECATED
  # syntax (with a startup WARNING) — including the three string-comparison
  # operators. RFC 9535 stays the canonical form. Cases 11819-11821 (HTTP),
  # 11700-11706 (config).
  role_claim_key_deprecated_fallback_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L468
  role_claim_key_deprecated_eval_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config/DeprecatedJSPath.hs#L67
  role_claim_key_deprecated_cases: [11819, 11820, 11821]
  role_claim_key_default: "$.role"
  role_claim_key_default_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config/JSPath.hs#L31
  role_claim_key_default_applied_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L465
  role_claim_key_config: jwt-role-claim-key
  role_claim_key_config_alias: role-claim-key
  role_claim_key_config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L335
  role_claim_key_migration_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/CHANGELOG.md#L126
  # When the path matches several nodes, the FIRST is used.
  role_claim_key_first_match_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config/JSPath.hs#L49
  # An unparseable value aborts startup with a non-zero exit code and
  # "failed to parse role-claim-key value (<value>)" on stderr. Examples of
  # values that are invalid under v16.0: ".role.other" (missing `$`),
  # "$.my_role;;domain".
  role_claim_key_invalid_message: "failed to parse role-claim-key value (<value>)"
  role_claim_key_invalid_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/test_cli.py#L216
  role_claim_key_invalid_values_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L188
  # Role extraction: evaluate the JSON Path against the claims; if it selects
  # nothing, fall back to db-anon-role; if that is unset too -> PGRST302.
  extraction_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Auth/Jwt.hs#L121
  # Working JSON Path shapes, each exercised end-to-end by the io suite.
  role_claim_key_examples:
    driver_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/test_config.py#L106
    nested_member:
      key: "$.postgrest.a_role"
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L123
    array_index:
      key: "$.customObject.manyRoles[1]"
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L129
    quoted_key:
      key: '$["https://www.example.com/roles"][0].value'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L137
    index_out_of_range:
      key: "$.myDomain[3]"
      status: 401
      note: "Selects nothing -> falls back to db-anon-role -> 42501 -> 401."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L143
    missing_key:
      key: "$.myRole"
      status: 401
      note: "A configured key fully replaces `$.role`; the token's `role` claim is not consulted."
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L150
    filter_equals:
      key: '$.realm_access.roles[?(@ == "postgrest_test_author")]'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L155
    filter_not_equals:
      key: '$.realm_access.roles[?(@ != "other")]'
      status: 200
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L162
  # The aud claim can double as the role claim.
  aud_as_role_claim:
    driver_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/test_config.py#L143
    string_match: {key: "$.aud", status: 200, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L171"}
    string_mismatch: {key: "$.aud", status: 401, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L175"}
    array_index: {key: "$.aud[0]", status: 200, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L179"}
    # Passes the audience check (any element matches) but selects a role that
    # does not exist -> SQLSTATE 22023 -> 401 (special-cased).
    nonexistent_role: {key: "$.aud[1]", status: 401, source: "https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/io/fixtures/fixtures.yaml#L183"}
    nonexistent_role_status_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L562
  # The same 401 is reached through the DEFAULT `$.role` path when the token
  # simply names a role that does not exist. NEW as a black-box assertion in
  # v16.0 (ErrorSpec "JWT Errors"); at v14.12 only test/io/test_auth.py, now
  # deleted, asserted it — and only the message, not the envelope. The response
  # carries the raw Postgres envelope: `code` is the SQLSTATE 22023, not a
  # PGRST* code, and `details`/`hint` are null.
  role_does_not_exist:
    status: 401
    code: "22023"
    message: 'role "not existing" does not exist'
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/ErrorSpec.hs#L130
    status_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L559
  # With no JWT, requests run as the configured db-anon-role
  # (postgrest_test_anonymous in the fixtures).
  anon_role_when_no_jwt:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L999
  # A valid token with role=postgrest_test_author can read authors_only (200).
  valid_role_grants_access:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L75
  # Extra unknown claims in the token are ignored (still 200).
  extra_claims_ignored:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L80
  anonymous:
    # Anonymous (no token) hitting a table it cannot read -> 401 with the
    # Postgres 42501 permission-denied envelope and WWW-Authenticate: Bearer.
    no_token_permission_denied:
      status: 401
      code: "42501"
      www_authenticate: "Bearer"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L15
    # 401 (any unauthenticated/JWT error) gets WWW-Authenticate: Bearer.
    www_authenticate_on_401_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L469
    # An *authenticated* role lacking a privilege gets 403 (NOT 401), and no
    # WWW-Authenticate header.
    authenticated_no_privilege:
      status: 403
      code: "42501"
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L29
    authenticated_flag_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L591
    # Anonymous calling an RPC it cannot execute -> 401.
    rpc_no_execute_denied: {status: 401}
    rpc_no_execute_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L41
  no_anon_role_configured:
    # If db-anon-role is unset, an anonymous request -> 401 PGRST302
    # "Anonymous access is disabled" with WWW-Authenticate: Bearer.
    anonymous_disabled: {status: 401, code: PGRST302, message: "Anonymous access is disabled", www_authenticate: "Bearer"}
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/NoAnonSpec.hs#L24
    required_token_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Error.hs#L689
    # A valid token still authenticates normally even when anon is disabled.
    valid_token_still_works:
      source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/NoAnonSpec.hs#L14

# ===========================================================================
# db-pre-request: a stored proc run before the main query, inside the tx,
# after role switching, that can further SET LOCAL ROLE / raise.
# ===========================================================================
pre_request:
  config_key: db-pre-request
  config_alias: pre-request
  # The option parser, where both the canonical key and its deprecated alias are
  # declared: `optWithAlias (optString "db-pre-request") (optString "pre-request")`
  # — the same parseAppConfig block that declares jwt-aud (#L334) and
  # jwt-role-claim-key (#L335). (Config.hs#L193 is only the --dump-config output
  # row for db-pre-request; it never mentions the alias.)
  config_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Config.hs#L315
  # In v16.0 the pre-request call moved into its own module; it is still a bare
  # `select <proc>()` issued after the transaction variables (role included)
  # are set.
  query_shape: "select <schema>.<proc>()"
  query_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L67
  # The pre-request proc can read request.jwt.claims and switch role based on a
  # custom claim (here: id). id=1 -> postgrest_test_author.
  switch_on_claim_author:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L222
  # id=2 -> postgrest_test_default_role.
  switch_on_claim_default:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L234
  # A RAISE EXCEPTION in the pre-request proc surfaces as the proc's error;
  # P0001 with the raised message/hint -> 400.
  raise_propagates: {status: 400, code: P0001, message: "Disabled ID --> 3", hint: "Please contact administrator"}
  raise_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L246

# ===========================================================================
# GUCs exposed to SQL via current_setting()
# ===========================================================================
gucs:
  # All request GUCs are emitted by one `select set_config(...), ...` statement
  # built in Query/PreQuery.hs; the role is set in the same statement, before
  # the pre-request proc runs.
  emitter_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L45
  role_guc_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L54
  # request.jwt.claims: the full verified claims object as JSON text.
  request_jwt_claims:
    description: "JSON text of the verified JWT claims; current role is exposed as the .role member even when anonymous."
    anon_role_value: "postgrest_test_anonymous"
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L999
    # v16.0 moved the "insert role into the claims" step out of Auth/Jwt.hs and
    # into the GUC builder. Observable behavior is unchanged: the GUC still
    # carries a `role` member.
    role_injection_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L53
  # request.headers: JSON object of request headers, keys lowercased.
  request_headers:
    description: "JSON object of request headers; header names are lowercased. Includes the raw Authorization value."
    impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L49
    custom_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L979
    standard_header_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L989
    authorization_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L1039
  # request.cookies: JSON object of parsed Cookie header pairs.
  request_cookies:
    description: "JSON object of cookie name->value parsed from the Cookie header."
    impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L50
    single_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L1009
    multiple_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L1019
  # request.method: the HTTP method as a plain GUC (not under a JSON prefix).
  request_method:
    description: "HTTP method string, e.g. 'POST'."
    impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L47
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L1049
  # request.path: the request path as a plain GUC.
  request_path:
    description: "Request path string, e.g. '/rpc/get_guc_value'."
    impl_source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/src/library/PostgREST/Query/PreQuery.hs#L48
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Query/RpcSpec.hs#L1059

# ===========================================================================
# SQL-side JWT helpers (functions that mint/read tokens) — unchanged in v16.0
# ===========================================================================
sql_jwt_functions:
  mints_login_token:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L52
  encodes_custom_and_standard_claims:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L63
  reads_claims_from_guc:
    source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L70

# ===========================================================================
# Gaps: behaviors in scope but not traceable to a concrete v16.0 source line,
# plus behavior that existed at the previous pin and no longer exists.
# ===========================================================================
gaps:
  - "RESTORED (v16.2, deprecated): v16.0 DROPPED the JSPath DSL form of
     `jwt-role-claim-key` — values without a leading `$` (e.g. `.role`,
     `.postgrest.a_role`) were startup errors and `.role.other` sat in
     upstream's `invalidroleclaimkeys`. v16.2 (PostgREST#5171) accepts the DSL
     again as deprecated syntax with a startup WARNING; `.role.other` loads, and
     upstream moved the DSL's own failures to `deprecatedinvalidroleclaimkeys`
     (test/io/fixtures/fixtures.yaml#L289). The default stays `$.role`
     (RFC 9535) — the v14.12 entry `role_claim_key_default: \".role\"` is still
     not restored. Cased by 11819 (HTTP) and 11700/11701 (config); 1711 now
     pins `@@.role.other`, which neither grammar accepts."
  - "RESTORED (v16.2, deprecated): the string-comparison operators `^==`, `==^`
     and `*==`, removed with the DSL at v16.0 (CHANGELOG.md#L131), parse and
     evaluate again inside the deprecated syntax only — RFC 9535 still has none.
     Cased by 11702-11706 (all five DSL operators, parse) and 11820 (`^==`,
     evaluation). The RFC 9535 replacement,
     `$.roles[?search(@, \"^postgrest_test_\")]`, still has NO upstream fixture
     or test exercising `search()` end-to-end, so no case is authored for it."
  - "NOTE: `src/library/PostgREST/Config.hs#L803` still prints
     `jwt-role-claim-key = \".role\"` in the `--example` config template — an
     upstream staleness bug, contradicted by the real default at
     Config/JSPath.hs#L31 and by every expected --dump-config fixture
     (test/io/configs/expected/defaults.config#L29 = `$$.role`). The v14.12
     spec cited that example line for the default; this re-sync cites the
     implementation instead."
  - "ES256 verification: jose/JWKS supports it (Config.hs#L585 accepts a JWKS),
     but v16.0 still has no ES256 conformance test in test/spec/Feature/Auth.
     Only HS256 (AuthSpec/BinaryJwtSecretSpec) and RS256 (AsymmetricJwtSpec,
     now both JWK and JWKS forms) are test-anchored. No black-box case authored
     for ES256."
  - "EdDSA (Ed25519) verification: same as ES256 — library-supported via the
     JWKS path but no upstream conformance test in v16.0. Omitted, not guessed."
  - "JWKS multi-key rotation / kid selection: KeyError 'No suitable key' is
     defined (Error.hs#L659) but no v16.0 Feature/Auth test exercises kid
     matching against a multi-key JWKS — the new JWKSet context uses a
     single-key set. Omitted."
  - "needed_assertion: relative-time claim values. Upstream expresses its time
     claims as `relativeSeconds N` against the wall clock, deliberately picking
     ±35s — 5s outside the 30s allowance — under the context name 'we allow 30
     seconds clock skew' (ErrorSpec.hs#L144-L187); `relativeSeconds 0` is the
     valid-iat counterpart (AuthSpec.hs#L92). `request.jwt.payload` is a static
     JSON object, so cases 11811/11812 (and 1456) can only use fixed sentinels
     far outside the window — they pin the error, not its boundary. Expressing
     the boundary needs a relative-time primitive in the payload, e.g.
     `exp: {relative_seconds: -35}` resolved by the harness at request time.
     Until then the 30s allowance (Auth/Jwt.hs#L70) is modeled here but no case
     constrains it, in either direction. Note that upstream itself never asserts
     the inside-the-window side (e.g. exp = now-25s succeeding) either, so a
     case for that would have no ground truth to cite."
  - "NOT EXPANDED (deliberate): AudienceJwtSecretSpec's `disabledSpec` block
     (jwt-aud unset) repeats the SAME assertion — aud is ignored, 200 — once per
     aud shape: string #L178, empty string #L191, 1-element array #L205,
     multi-element array #L219, empty array #L233, null #L247, absent #L262, no
     JWT #L275. `audMatchesCfg` degenerates to `const True` when jwt-aud is
     unset (Config.hs#L84), so the aud value is never inspected and all eight
     it-blocks exercise one code path. Only the first is modeled
     (`when_jwt_aud_unset.any_aud_ignored`, case 1474); the other seven would be
     seven copies of one case. Every it-block of the ENABLED `spec` block
     (jwt-aud set) is, by contrast, now pinned one-for-one: #L24->1468,
     #L37->1469, #L53->1470, #L70->11817, #L84->1471, #L98->11818, #L114->1472,
     #L130->1473, #L144->11816, #L159->11815, #L172->1494."
  - "needed_assertion: multi-request sequences. TWO upstream behaviors need a
     case shape that can issue more than one request, which case.schema.json
     cannot express today; both are modeled nowhere else, so they are recorded
     here rather than silently dropped.
     (a) Feature/Auth/JwtCacheSpec.hs asserts properties across two IDENTICAL
     requests (second JWT parse duration <= the first; both succeed). Case 1497
     pins only the single-shot 200. An assertion style like `repeat: 2` plus
     per-response assertions (or a `header_monotonic` comparator on
     Server-Timing) would cover the cache-hit behavior.
     (b) AuthSpec.hs#L144 'recovers after 401 error with logged in user' is a
     three-request SEQUENCE with DIFFERENT requests: an unauthenticated
     `POST /authors_only` (which 401s), then `POST /rpc/problem` with a valid
     postgrest_test_author token (which errors inside the proc), then
     `GET /authors_only` with that same token, which must return 200 — i.e. a
     failed request must not poison the connection/transaction state for the
     next one. Expressing it needs an ordered `requests:` list with the
     assertion attached to the last element; approximating it with the final
     GET alone would assert nothing about recovery, so no case was authored.
     Source: https://raw.githubusercontent.com/PostgREST/postgrest/v16.4/test/spec/Feature/Auth/AuthSpec.hs#L144"
  - "id-band: the v16.0 re-sync grew auth from 45 to 69 cases. The first 5
     additions filled the primary band to its ceiling (1495-1499); with
     1450-1499 then FULL (all 50 ids in use), the remaining 19 went to the
     closed overflow band this run assigned to auth, 11800-11818. Those 19 are
     the only 5-digit case ids in the whole tree, and because `11800` sorts
     immediately after `1180` they interleave with the filters area's 1180-1189
     cases in any lexical (non-numeric) listing. They were deliberately NOT
     renumbered into a free 4-digit band: the assigned overflow range is this
     fan-out's cross-area collision-avoidance mechanism, and straying outside it
     could collide with a concurrently-running area's allocation. Action for the
     harness/index owner: spec/conformance/INDEX.md must record auth as
     `1450-1499 + 11800-11818`, 69 cases — this pass edited that row in place,
     and any regeneration of INDEX.md must preserve the two-range band rather
     than re-deriving a single contiguous one. If the tree later standardizes on
     4-digit ids, renumber 11800-11818 as one atomic pass across all areas. EXTENDED 2026-10-02 (v16.4 re-pin): 11819-11821 continue the same band
     contiguously for the deprecated role-claim-key syntax; auth is now
     `1450-1499 + 11800-11821`, 72 cases."
  - "harness: per-case `config:` blocks in this area. test/support/
     conformance_server.ex spins a dedicated instance only for ids listed in its
     hard-coded `@variant_case_ids`; everything else runs on the shared `auth`
     instance (jwt_secret \"reallyreallyreallyreallyverysafe\", db_anon_role
     postgrest_test_anonymous, db_pre_request auth.switch_role, jwt-aud unset,
     default role-claim-key `$.role`). Exact inventory, from grepping `^config:`
     over the cases whose `feature:` starts with auth — (a) ALREADY
     variant-backed: 1467, 1468, 1469, 1470, 1471, 1472, 1473, 1491, 1493.
     (b) MUST BE ADDED by the harness owner — they carry `config:`, are not
     listed, and the pinned expectation depends on that config: 1495, 1498, 1499,
     11800, 11801, 11802, 11803, 11804, 11805, 11806, 11807, 11808, 11815, 11816,
     11817, 11818. The last four are the aud cases this pass added; each sets
     `jwt-aud: youraudience`, exactly like the already-variant-backed 1468-1473,
     and 11815/11816/11817 would FALSELY pass on the shared instance (where
     jwt-aud is unset, so every aud is ignored and 200 is reached for the wrong
     reason) — they only constrain anything once the variant runs. Case 1495
     additionally needs the symbolic jwt-secret value
     `asymmetric_jwks_public_key` registered next to the existing
     `asymmetric_jwk_public_key` (the same RS256 public JWK wrapped as
     `{\"keys\": [ ... ]}`); the harness `resolve/1` maps only the latter today.
     (c) carry `config:` and are not listed, but the shared `auth` instance
     already satisfies them so the expectation holds either way (adding them is
     harmless, not required): 1466 — its `jwt-secret` is the base64 spelling of
     those same 32 secret bytes, which is exactly why the case must carry
     `jwt-secret` alongside `jwt-secret-is-base64: true`; 1474 (jwt-aud: null =
     the shared default); 1475, 1476, 1477 (db-pre-request test.switch_role vs
     the equivalent auth.switch_role mirror the shared instance runs); 1492
     (db-anon-role: null — a valid token authenticates regardless); 1494
     (jwt-aud set, but the request carries no JWT); 1497 (jwt-cache-max-entries /
     server-timing-enabled affect instrumentation only, and the pinned
     observable is the 200). (d) carry NO `config:` at all and therefore need no
     harness action: 1496 (a plain `iat` payload case — an earlier pass wrongly
     counted it among the config-carrying ids) and 11809-11814."
  - "harness (optional): case 11809 needs a token signed with a secret OTHER
     than the server's, which `request.jwt.sign_with` cannot name (the harness
     map holds only `hs256_test_secret`). The token is therefore spelled out as
     a literal Authorization header, reproducing upstream's
     `generateJWTWithSecret [json|{}|] \"wrong secret\"` byte for byte
     (SpecHelper.hs#L239). Registering a second symbolic secret (e.g.
     `hs256_wrong_secret` -> `wrong secret`) would let that case go back to the
     declarative `jwt:` form; nothing depends on it."
  - "Proxy-Status on JWT errors: ErrorSpec.hs#L54 asserts that a PGRST301
     response also carries `Proxy-Status: PostgREST; error=PGRST301` (and
     `Content-Length: 89`). That it-block predates the v16.0 pin and the header
     is generic error-envelope behavior owned by the errors area (cases 1002,
     1506, 1515-1516, 1518 already pin it for other codes), so no auth case
     duplicates it. No auth case asserts Proxy-Status today; adding it to case
     1457 (the same 2-part token) would close it without a new id."
  - "Upstream AuthSpec pins exact `Content-Length` values on three responses
     (96 on the anon 42501 401, 97 on the authenticated 42501 403, 100 on the
     empty-JWT PGRST301 401 — AuthSpec.hs#L25, #L38, #L108). These matchers
     already existed at the v14.12 pin and were not carried into cases
     1450/1451/1455, so this re-sync left them alone rather than widening scope;
     they remain an available strengthening of those three cases."
  - "loader_exposure: none required. Every new case reuses objects the loader
     already builds for the `auth` label (auth.authors_only); no new fixture
     object and no new fixture-set label were needed, so no
     spec/conformance/fixtures/auth.delta.sql was written."
